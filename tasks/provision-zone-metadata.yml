---

- name: Provision the zone metadata
  when: not ansible_check_mode
  tags:
    - config
  block:
    # Read first, so that an entry whose values are already stored is not written
    # again. A PUT always answers 200 whether or not it altered anything, so
    # without this comparison every converge would report a change.
    #
    # 404 means the zone is not there. With pdns_provision_ignore_missing_zone
    # set it is accepted as an outcome rather than a failure, and the entries for
    # that zone are skipped below on the same test.
    - name: Retrieve the current zone metadata
      ansible.builtin.uri:
        headers:
          X-Api-Key: "{{ pdns_config['api-key'] }}"
        url: "{{ pdns_api_url }}/zones/{{ _zone }}/metadata"
        method: GET
        status_code: "{{ [200] + (pdns_provision_ignore_missing_zone | bool | ternary([404], [])) }}"
      run_once: "{{ pdns_provision_run_once | bool }}"
      throttle: 1
      loop: "{{ pdns_provision_zone_metadata | map(attribute='zone') | unique | list }}"
      loop_control:
        loop_var: _zone
      register: _pdns_metadata_current
      check_mode: false
      changed_when: false

    # PUT replaces the values of one kind and leaves the other kinds of the zone
    # alone, which makes each entry independently declarative. POST would append
    # to whatever is already stored, so a declared list would grow on every
    # converge instead of settling.
    #
    # There is no prune for metadata and none is needed: PUT with an empty
    # `metadata` list removes the kind from the zone, so an entry declaring
    # `metadata: []` is how a kind is taken away.
    - name: Set the zone metadata
      ansible.builtin.uri:
        headers:
          X-Api-Key: "{{ pdns_config['api-key'] }}"
        url: "{{ pdns_api_url }}/zones/{{ _metadata.zone }}/metadata/{{ _metadata.kind }}"
        method: PUT
        body_format: json
        body: "{{ _metadata | dict2items | rejectattr('key', 'in', ['zone', 'kind']) | items2dict }}"
        status_code:
          - 200
      run_once: "{{ pdns_provision_run_once | bool }}"
      throttle: 1
      changed_when: true
      loop: "{{ pdns_provision_zone_metadata }}"
      loop_control:
        loop_var: _metadata
        label: "{{ _metadata.zone }}/{{ _metadata.kind }}"
      vars:
        _zone_result: >-
          {{ (_pdns_metadata_current.results | default([]))
             | selectattr('_zone', 'equalto', _metadata.zone)
             | first | default({}) }}
        _stored: >-
          {{ (_zone_result.json | default([]))
             | selectattr('kind', 'equalto', _metadata.kind)
             | map(attribute='metadata')
             | first | default([]) }}
      when:
        - _zone_result.status | default(0) == 200
        - _stored != (_metadata.metadata | default([]))
