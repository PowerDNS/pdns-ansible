---

- name: Provision the autoprimaries
  when: not ansible_check_mode
  tags:
    - config
  vars:
    # An autoprimary is identified by its ip and its nameserver together, which is
    # also what the DELETE path is built from. Both sides are reduced to
    # "ip/nameserver" so the two lists can be compared directly.
    _pdns_autoprimaries_stored: >-
      {{ (_pdns_autoprimaries_current.json | default([]))
         | map(attribute='ip')
         | zip((_pdns_autoprimaries_current.json | default([])) | map(attribute='nameserver'))
         | map('join', '/') | list }}
    _pdns_autoprimaries_declared: >-
      {{ (pdns_provision_autoprimaries | default([]))
         | map(attribute='ip')
         | zip((pdns_provision_autoprimaries | default([])) | map(attribute='nameserver'))
         | map('join', '/') | list }}
  block:
    - name: Retrieve the current autoprimaries
      ansible.builtin.uri:
        headers:
          X-Api-Key: "{{ pdns_config['api-key'] }}"
        url: "{{ pdns_api_url }}/autoprimaries"
        method: GET
        status_code:
          - 200
      run_once: "{{ pdns_provision_run_once | bool }}"
      throttle: 1
      register: _pdns_autoprimaries_current
      check_mode: false
      changed_when: false

    # The entry is the request body as given, like every other list, so a field the
    # API grows later needs no change here. `account` is the one default, because
    # the API rejects a body without it; an entry that carries one overrides it.
    - name: Add the missing autoprimaries
      ansible.builtin.uri:
        headers:
          X-Api-Key: "{{ pdns_config['api-key'] }}"
        url: "{{ pdns_api_url }}/autoprimaries"
        method: POST
        body_format: json
        body: "{{ {'account': ''} | ansible.builtin.combine(_autoprimary) }}"
        status_code:
          - 201
      run_once: "{{ pdns_provision_run_once | bool }}"
      throttle: 1
      changed_when: true
      loop: "{{ pdns_provision_autoprimaries | default([]) }}"
      loop_control:
        loop_var: _autoprimary
        label: "{{ _autoprimary.ip }}/{{ _autoprimary.nameserver }}"
      when: (_autoprimary.ip ~ '/' ~ _autoprimary.nameserver) not in _pdns_autoprimaries_stored

    # Behind pdns_provision_prune like every other removal. Until this file was
    # brought in line with the rest, it deleted an autoprimary the list did not
    # mention on every converge, whatever else was set.
    - name: Remove the undeclared autoprimaries
      ansible.builtin.uri:
        headers:
          X-Api-Key: "{{ pdns_config['api-key'] }}"
        url: "{{ pdns_api_url }}/autoprimaries/{{ _stored.ip }}/{{ _stored.nameserver }}"
        method: DELETE
        status_code:
          - 204
      run_once: "{{ pdns_provision_run_once | bool }}"
      throttle: 1
      changed_when: true
      loop: "{{ _pdns_autoprimaries_current.json | default([]) }}"
      loop_control:
        loop_var: _stored
        label: "{{ _stored.ip }}/{{ _stored.nameserver }}"
      when:
        - pdns_provision_prune | bool
        - (_stored.ip ~ '/' ~ _stored.nameserver) not in _pdns_autoprimaries_declared
