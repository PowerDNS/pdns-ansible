---

##
# Provisioning through the REST API of the running instance.
#
# Every included file guards itself with `not ansible_check_mode` and carries the
# `config` tag on its own outer block: ansible.builtin.uri has no check mode of
# its own and fails under --check, and include_tasks does not pass its tags on to
# the tasks of the file it includes.
#
# The API key is read from pdns_config in each request rather than collected into
# a fact once. A run that changes the key writes the new one to the configuration
# file and restarts the instance before provisioning starts, so the key that
# reaches the API has to be the one in the configuration now, not the one that
# was there when the role began.
##

# Only when autoprimaries are declared, even with pdns_provision_prune enabled:
# the feature exists on gmysql, gpgsql and gsqlite3 alone, and listing them on any
# other backend answers 500 "Cannot find backend with autoprimary feature". A
# converge that never asked for an autoprimary must not fail on a backend that
# cannot have one, so the price is that emptying the list does not prune the last
# entry - the same limitation the views list has.
- name: Provision the autoprimaries
  ansible.builtin.include_tasks: provision-autoprimaries.yml
  when: (pdns_provision_autoprimaries | default([])) | length > 0
  tags:
    - config

- name: Provision the zones
  ansible.builtin.include_tasks: provision-zones.yml
  when: (pdns_provision_zones | default([])) | length > 0
  tags:
    - config

- name: Provision the records
  ansible.builtin.include_tasks: provision-records.yml
  when: (pdns_provision_records | default([])) | length > 0
  tags:
    - config

# Last of the legs, so a command can act on anything the API-driven ones created.
- name: Provision with pdnsutil
  ansible.builtin.include_tasks: provision-pdnsutils.yml
  when: (pdns_provision_pdnsutils | default([])) | length > 0
  tags:
    - config

- name: Provision the zone metadata
  ansible.builtin.include_tasks: provision-zone-metadata.yml
  when: (pdns_provision_zone_metadata | default([])) | length > 0
  tags:
    - config

- name: Provision the DNSSEC keys
  ansible.builtin.include_tasks: provision-cryptokeys.yml
  when: (pdns_provision_cryptokeys | default([])) | length > 0
  tags:
    - config

# Every list is skipped while it is empty, pruning included. The role is written
# to be included more than once in a play - one invocation per instance is the
# shape of the molecule scenarios - and an empty list means "this invocation has
# nothing to say about these", not "delete them all": otherwise the invocation
# that declares no TSIG keys would delete the keys the previous one just created,
# on every converge. So a prune only ever removes entries alongside the ones its
# own list declares, and emptying a list does not remove the last entry.
- name: Provision the TSIG keys
  ansible.builtin.include_tasks: provision-tsigkeys.yml
  when: (pdns_provision_tsigkeys | default([])) | length > 0
  tags:
    - config

- name: Provision the views
  ansible.builtin.include_tasks: provision-views.yml
  when: (pdns_provision_views | default([])) | length > 0
  tags:
    - config

- name: Provision the networks
  ansible.builtin.include_tasks: provision-networks.yml
  when: (pdns_provision_networks | default([])) | length > 0
  tags:
    - config
