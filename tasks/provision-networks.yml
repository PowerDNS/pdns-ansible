---

- name: Provision the networks
  when: not ansible_check_mode
  tags:
    - config
  block:
    - name: Retrieve the current networks
      ansible.builtin.uri:
        headers:
          X-Api-Key: "{{ pdns_config['api-key'] }}"
        url: "{{ pdns_api_url }}/networks"
        method: GET
        status_code:
          - 200
      run_once: "{{ pdns_provision_run_once | bool }}"
      throttle: 1
      register: _pdns_networks_current
      check_mode: false
      changed_when: false

    # PUT is both the create and the update here, and it answers 204 whether or
    # not anything moved, so the stored view of the network is compared first.
    #
    # The network is a CIDR and goes into the path with its slash unescaped, which
    # is what the API expects.
    - name: Map the networks to their views
      ansible.builtin.uri:
        headers:
          X-Api-Key: "{{ pdns_config['api-key'] }}"
        url: "{{ pdns_api_url }}/networks/{{ _network.network }}"
        method: PUT
        body_format: json
        body: "{{ _network | dict2items | rejectattr('key', 'equalto', 'network') | items2dict }}"
        status_code:
          - 204
      run_once: "{{ pdns_provision_run_once | bool }}"
      throttle: 1
      changed_when: true
      loop: "{{ pdns_provision_networks }}"
      loop_control:
        loop_var: _network
        label: "{{ _network.network }}"
      vars:
        _stored_view: >-
          {{ (_pdns_networks_current.json | default({})).get('networks', [])
             | selectattr('network', 'equalto', _network.network)
             | map(attribute='view')
             | first | default('') }}
      when: _stored_view != (_network.view | default(''))

    # An empty view is how the API unmaps a network, so a prune reassigns rather
    # than deletes.
    - name: Unmap the undeclared networks
      ansible.builtin.uri:
        headers:
          X-Api-Key: "{{ pdns_config['api-key'] }}"
        url: "{{ pdns_api_url }}/networks/{{ _stored.network }}"
        method: PUT
        body_format: json
        body:
          view: ""
        status_code:
          - 204
      run_once: "{{ pdns_provision_run_once | bool }}"
      throttle: 1
      changed_when: true
      loop: "{{ (_pdns_networks_current.json | default({})).get('networks', []) }}"
      loop_control:
        loop_var: _stored
        label: "{{ _stored.network }}"
      when:
        - pdns_provision_prune | bool
        - _stored.network not in (pdns_provision_networks | map(attribute='network') | list)
