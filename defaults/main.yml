---

# By default, no PowerDNS Authoritative Server repository will be configured by the role
pdns_install_repo: ""

# To install the PowerDNS Authoritative Server from the 'master' official repository
# use the following playbook snippet
# - hosts: all
#   roles:
#    - { role: PowerDNS.pdns,
#        pdns_install_repo: "{{ pdns_auth_powerdns_repo_master }}" }
#
# To install the PowerDNS Authoritative Server from the '4.8.x' official repository
# use the following playbook snippet
# - hosts: all
#   roles:
#    - { role: PowerDNS.pdns,
#        pdns_install_repo: "{{ pdns_auth_powerdns_repo_48 }}" }

# To install the PowerDNS Authoritative Server from the '4.9.x' official repository
# use the following playbook snippet
# - hosts: all
#   roles:
#    - { role: PowerDNS.pdns,
#        pdns_install_repo: "{{ pdns_auth_powerdns_repo_49 }}" }

# To install the PowerDNS Authoritative Server from the '5.0.x' official repository
# use the following playbook snippet
# - hosts: all
#   roles:
#    - { role: PowerDNS.pdns,
#        pdns_install_repo: "{{ pdns_auth_powerdns_repo_50 }}" }
#
# To install the PowerDNS Authoritative Server from the '5.1.x' official repository
# use the following playbook snippet
# - hosts: all
#   roles:
#    - { role: PowerDNS.pdns,
#        pdns_install_repo: "{{ pdns_auth_powerdns_repo_51 }}" }
#
# To make this role configure a custom repository and install the
# PowerDNS Authoritative Server from it override the `pdns_install_repo` variable
# as follows
# - hosts: all
#   vars:
#     pdns_install_repo:
#       apt_repo_origin: "example.com"  # Pin the PowerDNS packages to the provided repository origin
#       apt_version: "auth-50"          # Deb822 suite suffix (appended to release codename, Ubuntu >=22.04 / Debian >=11)
#       apt_repo: "deb http://example.com/{{ ansible_facts.distribution | lower }} {{ ansible_facts.distribution_release | lower }}/pdns main"
#       gpg_key: "http://example.com/MYREPOGPGPUBKEY.asc" # repository public GPG key
#       gpg_key_id: "MYREPOGPGPUBKEYID" # to avoid to reimport the key each time the role is executed
#       yum_repo_baseurl: "http://example.com/centos/$basearch/$releasever/pdns"
#       name: "powerdns"       # the name of the repository
#   roles:
#    - { role: PowerDNS.pdns }

pdns_install_repo_name: powerdns-authoritative
pdns_install_repo_regex: "{{ '^' + pdns_install_repo_name + '\\.(list|sources|repo|asc)$' }}"
pdns_remove_versioned_repo_regex: '^powerdns-auth-(master|\d+)\.(list|sources|repo|asc)$'
pdns_remove_versioned_repo_files: true

# Install the EPEL repository.
# EPEL is needed to satisfy some PowerDNS Authoritative Server dependencies like protobuf
pdns_install_epel: true

# The name of the PowerDNS Authoritative Server package
pdns_package_name: "{{ default_pdns_package_name }}"

# Install a specific version of the PowerDNS Authoritative Server package
# NB: The usage of this variable makes only sense on RedHat-like systems,
#     where each YUM repository can contains multiple versions of the same package.
pdns_package_version: ""

# Desired state of the PowerDNS Authoritative Server package.
# Supported values include present, latest and absent.
pdns_package_state: "present"

# Install the PowerDNS Authoritative Server debug symbols package
pdns_install_debug_symbols_package: false

# The name of the PowerDNS Authoritative Server debug symbols package
pdns_debug_symbols_package_name: "{{ default_pdns_debug_symbols_package_name }}"

# Desired state of the debug symbols package when managed by this role.
# Supported values include present, latest and absent.
pdns_debug_symbols_package_state: "{{ pdns_package_state }}"

# The user and group the PowerDNS Authoritative Server process will run as.
# NOTE: at the moment, we don't create a user as we assume the package creates
# a "pdns" user and group. If you change these variables, make sure to create
# the user and groups before applying this role
pdns_user: "pdns"
pdns_group: "pdns"
pdns_file_owner: "root"
pdns_file_group: "{{ pdns_group }}"

# Name of the PowerDNS Authoritative Server Service
pdns_service_name: "pdns"

# State of the PowerDNS Authoritative Server service
pdns_service_state: "started"
pdns_service_enabled: true
pdns_service_masked: false

# When True, disable the automated restart of the PowerDNS service
pdns_disable_handlers: false

# When true, run the notified handlers at the end of the role instead of at the
# end of the play. Set this when the role runs more than once in a play.
pdns_flush_handlers: false

# When true, manage SELinux booleans and ports on SELinux-enabled systems.
pdns_manage_selinux: true

# PowerDNS Authoritative Server configuration file and directory
pdns_config_dir: "{{ default_pdns_config_dir }}"
pdns_config_file: "pdns.conf"

# Dict containing all configuration options, except for backend
# configuration and the "config-dir", "setuid" and "setgid" directives.
pdns_config: {}
# pdns_config:
#  primary: true
#  secondary: false
#  local-address: '192.0.2.53'
#  local-ipv6: '2001:DB8:1::53'
#  local-port: '5300'

# Dict with overrides for the service (systemd only)
pdns_service_overrides: "{{ default_pdns_service_overrides }}"
# pdns_service_overrides:
#   LimitNOFILE: 10000

# Dictionary of packages that should be installed to enable the backends.
# backendname: packagename
pdns_backends_packages: "{{ default_pdns_backends_packages }}"

# Desired state of backend packages.
# Supported values include present, latest and absent.
pdns_backends_packages_state: "{{ pdns_package_state }}"

# A dict with all the backends you'd like to configure.
# This default starts just the bind-backend with an empty config file
pdns_backends:
  bind:
    config: '/dev/null'
# pdns_backends:
#   'gmysql:one':
#     'user': root
#     'host': 127.0.0.1
#     'password': root
#     'dbname': pdns
#   'gmysql:two':
#     'user': pdns_user
#     'host': 192.0.2.15
#     'port': 3307
#     'password': my_password
#     'dbname': dns
#   'bind':
#     'config': '/etc/named/named.conf'
#     'hybrid': true
#     'check-interval': 60
#     'dnssec-db': '{{ pdns_config_dir }}/dnssec.db'

# Additional directories to create before writing pdns_config_files.
# Each item can be:
# - a string path
# - or a dict with path/owner/group/mode
#
# Examples:
# pdns_config_additional_dirs:
#   - path: "{{ pdns_config['include-dir'] }}"
#     mode: "0775"
#   - "{{ pdns_config_dir }}/zones"
#   - "/var/lib/powerdns/rpz"
pdns_config_additional_dirs: []

# Files to copy into the PowerDNS configuration directory.
# Each item supports:
# - src: path on the controller
# - content: inline file content
# - dest: destination path (absolute, or relative to pdns_config_dir)
# - owner/group/mode: optional file attributes
# - dir_owner/dir_group/dir_mode: optional parent directory attributes
#
# Examples:
# pdns_config_files:
#   - src: files/pdns/my-named.conf
#     dest: named.conf
#     mode: "0640"
#   - dest: pipe-backend.py
#     mode: "0750"
#     content: |
#       #!/usr/bin/env python3
#       print("backend")
pdns_config_files: []

# Enable role-managed MySQL backend bootstrap tasks.
# When false, the role will only write gmysql backend settings in pdns.conf and won't connect to MySQL/MariaDB.
pdns_mysql_manage_database: true

# Which server the gmysql backend talks to, `mysql` or `mariadb`.
#
# It selects the collection that creates the database and the user: `ansible.mysql`
# for MySQL, `ansible.mariadb` for MariaDB. The two are the same code base split
# in two, and `ansible.mysql` still manages MariaDB today while warning that its
# support goes away in 6.0.0, so a MariaDB server keeps working with the default.
# Setting `mariadb` uses the collection that will keep supporting it.
#
# Only the database and user tasks are affected. The gmysql settings written to
# pdns.conf, the client packages and the schema import are identical either way.
pdns_mysql_flavor: mysql

# Administrative credentials to create the PowerDNS Authoritative Server MySQL backend database and user.
pdns_mysql_databases_credentials: {}
# pdns_mysql_databases_credentials:
#   'gmysql:one':
#     'priv_user': root
#     'priv_password': my_first_password
#     'priv_host':
#       - "localhost"
#       - "%"
#   'gmysql:two':
#     'priv_user': someprivuser
#     'priv_password': my_second_password
#     'priv_host':
#       - "localhost"

# Use a UNIX socket for role-internal MySQL operations (db create, grants, schema checks/import).
pdns_mysql_query_use_socket: false

# Packages needed to install MySQL dependencies.
# By default, OS-specific vars files provide the actual package list.
pdns_mysql_packages: "{{ default_pdns_mysql_packages }}"

# Desired state of MySQL dependency packages.
# Supported values include present, latest and absent.
pdns_mysql_packages_state: "{{ pdns_package_state }}"

# UNIX socket path used when pdns_mysql_query_use_socket is true.
pdns_mysql_unix_socket: "/var/run/mysqld/mysqld.sock"

# MySQL/MariaDB CLI command used for schema checks/import.
pdns_backends_mysql_cmd: "{{ default_pdns_backends_mysql_cmd }}"

# Additional arguments appended to the MySQL/MariaDB CLI command used for schema checks/import.
pdns_mysql_cli_extra_args: "{{ default_pdns_mysql_cli_extra_args }}"

# Authentication plugin used for created/granted MySQL users.
# Keep empty to let the module use legacy password flow (mysql_native_password path).
# Set to caching_sha2_password for MySQL 8.4/9+ servers where mysql_native_password is unavailable.
pdns_mysql_auth_plugin: ""

# Password update strategy for mysql_user task.
# Accepted values: always, on_create, on_new_username.
# Keep empty for role defaults:
# - on_create when pdns_mysql_auth_plugin is set
# - always when pdns_mysql_auth_plugin is empty
pdns_mysql_user_update_password: ""

# Enable role-managed PostgreSQL backend bootstrap tasks.
# When false, the role will only write gpgsql backend settings in pdns.conf and won't connect to PostgreSQL.
pdns_pgsql_manage_database: true

# Administrative credentials to create the PowerDNS Authoritative Server PostgreSQL backend database and user.
pdns_pgsql_databases_credentials: {}
# pdns_pgsql_databases_credentials:
#   gpgsql:
#     priv_user: postgres
#     priv_password: my_privileged_password

# Use a UNIX socket for role-internal PostgreSQL operations (db create, schema checks/import).
pdns_pgsql_query_use_socket: false

# Packages needed to install PostgreSQL dependencies.
# By default, OS-specific vars files provide the actual package list.
pdns_pgsql_packages: "{{ default_pdns_pgsql_packages }}"

# Desired state of PostgreSQL dependency packages.
# Supported values include present, latest and absent.
pdns_pgsql_packages_state: "{{ pdns_package_state }}"

# UNIX socket path used when pdns_pgsql_query_use_socket is true.
pdns_pgsql_unix_socket: "/var/run/postgresql"

# This will create the PowerDNS Authoritative Server backend SQLite database
# in the given locations.
# NOTE: Requires the SQLite CLI tools to be available in the machine and the gsqlite3
# backend to be installed on the machine.
pdns_sqlite_databases_locations: []

# Desired state of the SQLite CLI dependency package.
# Supported values include present, latest and absent.
pdns_sqlite_package_state: "{{ pdns_package_state }}"

# This will create the PowerDNS Authoritative Server backend LMDB database
# in the given locations.
# NOTE: Requires lmdb backend to be installed on the machine.
pdns_lmdb_databases_locations: []

# By default, we'll load the MySQL default schema. Set this to false to disable loading the schema
# (e.g. when importing your own dump later on).
# NOTE: This controls only schema check/import. User/database creation and grants are still executed
# when pdns_mysql_manage_database is true and administrative credentials are provided.
pdns_mysql_schema_load: true

# Override the schema used to initialize the MySQL database
# By default, this role tries to detect the correct file
pdns_mysql_schema_file: ""

# Run MySQL backend bootstrap tasks only on first node?
# This includes database creation, grants and schema import.
# This should be used if you install pdns on a cluster
pdns_mysql_schema_on_first_node_only: true

# By default, we'll load the PostgreSQL default schema. Set this to false to disable loading the schema
# (e.g. when importing your own dump later on).
# NOTE: This controls only schema check/import. User/database creation is still executed
# when pdns_pgsql_manage_database is true and administrative credentials are provided.
pdns_pgsql_schema_load: true

# Override the schema used to initialize the PostgreSQL database
# By default, this role tries to detect the correct file
pdns_pgsql_schema_file: ""

# Run pgsql backend bootstrap tasks only on first node?
# This includes database/user creation and schema import.
# This should be used if you install pdns on a cluster
pdns_pgsql_schema_on_first_node_only: true

# Override the schema used to initialize the SQLite database
# By default, this role tries to detect the correct file
pdns_sqlite_schema_file: ""

# Set debug mode flag from Ansible verbosity
pdns_verbose: "{{ ansible_verbosity | int >= 2 }}"

# Enable provisioning through the REST API of the running instance.
pdns_provision: false

##
# Provisioning through the REST API.
#
# Every list below is submitted to the API as written. The role does not
# interpret, rename or reorder the fields of an entry, so any setting the API
# accepts can be given whether or not the role knows about it - look up the
# fields in https://doc.powerdns.com/authoritative/http-api/ rather than here.
# Only the few keys named in each comment are read by the role itself, to build
# the request URL, and those are removed from the body before it is sent.
#
# Provisioning adds and never removes. An entry that is already there is left
# alone; anything on the server that no list mentions is left alone as well.
# pdns_provision_prune and pdns_provision_update_existing opt into the two
# behaviours that change or drop data that is already on the server.
##

# DEPRECATED: use pdns_provision_autoprimaries below.
#
# This name is the odd one out in a family where every other list is
# pdns_provision_*, and it will be removed in the next release. It is still read
# for now, because pdns_provision_autoprimaries defaults to it, so an existing
# playbook keeps working unchanged. Setting pdns_provision_autoprimaries takes
# precedence over it.
pdns_autoprimaries: []

# Autoprimaries.
#
# The role reads `ip` and `nameserver`, which identify an autoprimary together and
# are what its DELETE path is built from. Both are sent in the body as well, where
# the API expects them on a create. `account` defaults to an empty string, because
# the API rejects a body without it.
#
# NOTE: only the backends that implement the autoprimary feature accept these:
#   - gmysql
#   - gpgsql
#   - gsqlite3
pdns_provision_autoprimaries: "{{ pdns_autoprimaries }}"
# pdns_provision_autoprimaries:
#   - ip: 10.1.0.10
#     nameserver: ns1.example.com
#   - ip: 10.1.0.11
#     nameserver: ns2.example.com
#     account: account1

# Zones, including catalog zones.
#
# A catalog is an ordinary zone with `kind` set to Producer or Consumer, and a
# member zone joins one by naming it in `catalog`, so both are declared here.
#
# The role reads `name`: it is the identity the existence check and the request
# URL are built from. Everything else is the request body.
pdns_provision_zones: []
# pdns_provision_zones:
#   - name: catalog.invalid.
#     kind: Producer
#   - name: example.com.
#     kind: Native
#     catalog: catalog.invalid.
#     nameservers:
#       - ns1.example.com.
#     soa_edit_api: DEFAULT
#     rrsets:
#       - name: www.example.com.
#         type: A
#         ttl: 3600
#         records:
#           - content: 192.0.2.1
#             disabled: false

# Records of a zone, one entry per RRset.
#
# A zone and its records are separate resources with separate endpoints, so they
# are declared separately: pdns_provision_zones brings the zone into existence,
# this brings its records to the declared state. Records given inside a
# pdns_provision_zones entry are only written when that zone is created, because
# the create is the one request that carries them.
#
# The role reads `zone`, which names the zone in the request URL. The rest of the
# entry is one RRset of the request body: `name`, `type`, `ttl`, `records` and
# `changetype`.
#
# `changetype` defaults to REPLACE, which creates the RRset or replaces it
# wholesale - it is scoped to one name and type and leaves every other record in
# the zone alone. DELETE removes it, and needs only `name` and `type`. There is no
# prune: an RRset the lists do not mention is left alone, and DELETE is how one is
# taken away, because "remove every record I did not declare" would empty a zone
# on an incomplete list.
#
# A trailing dot is added to `name` if it is missing, since that is how the API
# stores it.
pdns_provision_records: []
# pdns_provision_records:
#   - zone: example.com.
#     name: www.example.com.
#     type: A
#     ttl: 3600
#     records:
#       - content: 192.0.2.1
#       - content: 192.0.2.2
#   - zone: example.com.
#     name: example.com.
#     type: MX
#     ttl: 3600
#     records:
#       - content: "10 mail.example.com."
#   - zone: example.com.
#     name: retired.example.com.
#     type: A
#     changetype: DELETE

# Metadata of a zone.
#
# The role reads `zone` and `kind`, which name the zone and the metadata kind in
# the request URL. The rest is the body, so in practice that is `metadata`.
#
# Written with PUT, which replaces the values of that one kind and leaves every
# other kind of the zone untouched. A POST would append to the existing values
# instead, which does not converge on a declared list.
pdns_provision_zone_metadata: []
# pdns_provision_zone_metadata:
#   - zone: example.com.
#     kind: ALLOW-AXFR-FROM
#     metadata:
#       - 127.0.0.0/8
#   - zone: example.com.
#     kind: SOA-EDIT-API
#     metadata:
#       - DEFAULT

# DNSSEC keys of a zone.
#
# The role reads `zone`, which names the zone in the request URL, and `force`.
# The rest is the body: `keytype`, `algorithm`, `bits`, `active`, `published`,
# and `content` to import a private key instead of generating one.
#
# Creating a key is the one request that cannot be repeated safely: the API
# assigns an id and answers 201 every time, so posting the same entry twice
# leaves the zone with two different keys, and it exposes nothing that would let
# the role recognise a key it created earlier. So a zone that already has keys is
# left alone, and an entry is only created while the zone has none at all. Set
# `force: true` on an entry to post it regardless, which is what a key rollover
# needs - the operator decides when that happens, not the converge.
pdns_provision_cryptokeys: []
# pdns_provision_cryptokeys:
#   - zone: example.com.
#     keytype: csk
#     algorithm: ECDSAP256SHA256
#     active: true
#   - zone: rollover.example.
#     keytype: ksk
#     algorithm: ECDSAP256SHA256
#     active: false
#     force: true

# TSIG keys.
#
# The whole entry is the request body. The role reads `name` as the identity of
# the key. Leave `key` out to have the server generate the secret.
pdns_provision_tsigkeys: []
# pdns_provision_tsigkeys:
#   - name: axfr-key
#     algorithm: hmac-sha256
#   - name: pinned-key
#     algorithm: hmac-sha256
#     key: "a base64 encoded secret"

# Zones of a view.
#
# The role reads both keys: `view` names the view in the request URL and `zones`
# is submitted one entry at a time. A member is a zone named
# `<zone>..<variant>`, and it has to exist as a zone - declare it in
# pdns_provision_zones - before it can join a view.
#
# Views need `views: yes` in pdns_config. Without it the API rejects both the
# variant zone and the view membership.
pdns_provision_views: []
# pdns_provision_views:
#   - view: internal
#     zones:
#       - example.com..intern

# Networks mapped to a view.
#
# The role reads `network`, which names the network in the request URL. The rest
# is the body, so in practice that is `view`.
pdns_provision_networks: []
# pdns_provision_networks:
#   - network: 192.0.2.0/24
#     view: internal

# Commands to run through pdnsutil.
#
# For the things the REST API cannot do - a backend that has no API support, a
# subcommand with no API equivalent, a bulk edit. Each entry is:
#
#   args:    the pdnsutil arguments, without the binary
#   unless:  optional, the arguments of a probe that succeeds when the work is
#            already done. The command runs only when the probe fails.
#
# pdnsutil commands are not idempotent by themselves - create-zone on an existing
# zone fails - so `unless` is how an entry becomes safe to repeat. An entry without
# it runs on every converge and reports changed every time.
#
# The commands run as pdns_user, never as root: pdnsutil writes the backend's own
# files, and root-owned ones leave the unprivileged server unable to write them.
pdns_provision_pdnsutils: []
# pdns_provision_pdnsutils:
#   - args: create-zone example.com ns1.example.com
#     unless: list-zone example.com
#   - args: set-kind example.com native
#   - args: secure-zone example.com
#     unless: show-zone example.com
#   - args: increase-serial example.com

# The pdnsutil invocation the commands above are appended to.
#
# It carries the configuration directory and, for an instance whose configuration
# file is pdns-<name>.conf, the --config-name that selects it - pdnsutil addresses
# one instance at a time and silently works on the default one otherwise. Override
# it to reach a pdnsutil that is not on PATH, or to add flags of your own.
pdns_provision_pdnsutils_command: >-
  pdnsutil --config-dir={{ pdns_config_dir }}
  {{ ('--config-name=' ~ (pdns_config_file | regex_replace('^pdns-', '') | regex_replace('\.conf$', '')))
     if pdns_config_file != 'pdns.conf' else '' }}

# Apply the declared attributes to zones that already exist.
#
# Off by default, because the role otherwise never changes a zone it did not
# create. When enabled, the attributes of a zone entry - kind, catalog, masters,
# account and so on - are written onto the existing zone with PUT. Its records
# are not touched: PUT on a zone carries attributes only.
pdns_provision_update_existing: false

# Delete what the lists do not declare.
#
# Off by default: provisioning adds and leaves everything else alone, so a host
# whose lists are incomplete does not lose data. When enabled, autoprimaries, TSIG
# keys and view members that no list mentions are deleted, and a network no list
# mentions is unmapped from its view.
#
# Zones and DNSSEC keys are never deleted, whatever this is set to; dropping a zone
# or a key is not something a converge should decide. Zone metadata needs nothing
# here either - an entry declaring `metadata: []` removes that kind.
#
# A prune only ever removes entries alongside the ones its own list declares, and
# a list that is empty prunes nothing - so emptying a list does not remove the
# last entry. That is because the role is written to be included more than once in
# a play, one invocation per instance: an empty list means "this invocation has
# nothing to say about these", and reading it as "delete them all" would have the
# invocation that declares no TSIG keys delete the keys the previous one just
# created, on every converge. View membership is likewise pruned only within the
# views pdns_provision_views names.
pdns_provision_prune: false

# Run the provisioning once per play, against the first host, instead of once per
# host.
#
# Provisioning writes into the storage backend through the API of one instance, so
# where several hosts share one database - gmysql, gpgsql, or gsqlite3 on shared
# storage - the second host onwards has nothing left to do, and a play over a
# cluster otherwise repeats every request once per host.
#
# Off by default, because it is only correct when the backend really is shared.
# With a per-host backend - lmdb, bind, or a local gsqlite3 file - each host has a
# database of its own, and running once would leave every host but the first
# unprovisioned.
pdns_provision_run_once: false

# Tolerate an entry whose zone does not exist.
#
# Metadata and DNSSEC keys are addressed under a zone, and the API answers 404
# when that zone is absent - which happens routinely while a zone is created by
# something other than this role, or is declared for a host that does not serve
# it yet. The entry is then skipped instead of failing the play. Set this to
# false to have the missing zone fail the run.
pdns_provision_ignore_missing_zone: true

# URL of the PowerDNS api endpoint.
pdns_api_url: http://{{ pdns_config['webserver-address'] | default('127.0.0.1') | replace('0.0.0.0', '127.0.0.1') | replace('::', '::1') }}:{{ pdns_config["webserver-port"] | default("8081") }}/api/v1/servers/{{ pdns_api_server_id }}
