---

##
# Configuration shared by every Molecule scenario.
#
# This file is not auto-discovered: Molecule only looks for a base config at
# .config/molecule/config.yml, so every invocation names it explicitly, which is
# what tox and the CI workflow do:
#
#   molecule -c molecule/config.yml -c molecule/platforms/<set>.yml test -s <scenario>
#
# Files given with --base-config are merged in order and the scenario's own
# molecule.yml is merged last. A platform set replaces the platform list below,
# because merging overwrites lists rather than appending to them.
##

driver:
  # The scenarios create their own containers in molecule/resources/create.yml,
  # so no driver plugin is involved. The connection plugin the Docker driver
  # would have configured is declared in the inventory below.
  name: default

dependency:
  name: galaxy

provisioner:
  name: ansible
  options:
    diff: true
    v: true
  config_options:
    defaults:
      # Under the home directory of the connection user the temporary files of a
      # task with become_user are unreachable for the target account on the
      # distributions that create a home directory with mode 0700, and Ansible
      # then depends on setfacl alone. A path under /tmp is traversable
      # everywhere.
      remote_tmp: /tmp/.ansible/tmp
      gathering: smart
      fact_caching: jsonfile
      fact_caching_connection: .ansible_cache
      fact_caching_timeout: 7200
    ssh_connection:
      pipelining: true
  inventory:
    # Molecule writes group_vars only when no inventory link is configured
    # (manage_inventory: `if not self.links`), so the two cannot be combined.
    group_vars:
      all:
        ansible_connection: community.docker.docker
        # Connect as the unprivileged `ansible` account the images create and
        # escalate through its passwordless sudo, the same path a deployment
        # takes. Escalation is configured here and not in the playbooks, so a
        # task only names become_user when it needs a service account, which
        # here is the pdnsutil calls of molecule/resources/tasks/pdns-zone.yml.
        #
        # sudo on the Enterprise Linux images relies on the pam_localuser line
        # the image template adds: without it the account phase of pam_unix
        # aborts every escalation with "PAM account management error".
        ansible_user: ansible
        ansible_become: true
  playbooks:
    create: ../resources/create.yml
    destroy: ../resources/destroy.yml
    prepare: ../resources/prepare.yml

verifier:
  name: testinfra
  options:
    v: true
    # The tests read root-owned configuration and query systemd, and they
    # connect through the inventory above as the unprivileged `ansible` user,
    # so they escalate the same way the plays do.
    sudo: true
    hosts: "pdns"

# Platform used when no platform set is given, which keeps a plain
# `molecule test` usable while developing. CI always passes a platform set.
platforms:
  - name: rockylinux-9
    groups: ["pdns"]
    image: rockylinux:9
    dockerfile_tpl: el-systemd
