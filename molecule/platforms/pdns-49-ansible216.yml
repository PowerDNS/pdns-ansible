---

##
# Platforms for PowerDNS Authoritative Server 4.9 that need ansible-core 2.16, always run
# with the ansible216 tox environment.
#
# Enterprise Linux 8 has Python 3.6 and 2.16 is the last ansible-core whose
# modules run on it. Those hosts cannot move to a newer ansible-core, which is
# why the role has to keep working with 2.16.
#
# Ubuntu 20.04 is here too: its Python is 3.8, and while ansible-core 2.18 could
# manage that, upstream publishes focal packages for this release only, so it is
# simplest to keep every old-Python platform on the same leg.
#
# These platforms are never run with ansible218 or ansible220.
##

platforms:

  - name: rockylinux-8
    groups: ["pdns"]
    image: rockylinux:8
    dockerfile_tpl: el-systemd

  - name: oraclelinux-8
    groups: ["pdns"]
    image: oraclelinux:8
    dockerfile_tpl: el-systemd

  - name: ubuntu-2004
    groups: ["pdns"]
    image: ubuntu:20.04
    dockerfile_tpl: debian-systemd
