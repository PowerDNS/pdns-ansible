---

- name: Create
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/molecule.yml
    - vars/services.yml
  tasks:

    - name: Fail when no platform was configured
      ansible.builtin.assert:
        that: molecule_yml.platforms | default([]) | length > 0
        fail_msg: >-
          No platform is configured. molecule/config.yml is not auto-discovered,
          so pass it and a platform set:
          molecule -c molecule/config.yml -c molecule/platforms/<set>.yml ...
        quiet: true

    - name: Detect host architecture for Docker platform selection
      ansible.builtin.set_fact:
        _molecule_host_arch: "{{ lookup('pipe', 'uname -m') | trim | lower }}"
      changed_when: false

    - name: Define Docker architecture/platform mappings
      ansible.builtin.set_fact:
        _molecule_arch_map:
          x86_64: amd64
          amd64: amd64
          aarch64: arm64
          arm64: arm64
          armv8l: arm64
      changed_when: false

    - name: Set Docker target architecture and platform
      ansible.builtin.set_fact:
        molecule_docker_arch: "{{ _molecule_arch_map.get(_molecule_host_arch, _molecule_host_arch) }}"
        molecule_docker_platform: "linux/{{ _molecule_arch_map.get(_molecule_host_arch, _molecule_host_arch) }}"
      changed_when: false

    - name: Get list of service instances
      ansible.builtin.set_fact:
        molecule_service_instances: >-
          {{ molecule_service_definitions
             if (lookup('env', 'MOLECULE_WITH_SERVICES') | default('', true) | bool)
             else [] }}

    - name: Get list of platform instances
      ansible.builtin.set_fact:
        molecule_platform_instances: "{{ molecule_yml.platforms }}"

    - name: Create Dockerfiles from platform names
      ansible.builtin.template:
        src: "Dockerfile.{{ item.dockerfile_tpl | default('default') }}.j2"
        dest: "{{ molecule_ephemeral_directory }}/Dockerfile_{{ item.name | regex_replace('[^a-zA-Z0-9_]', '_') }}"
        mode: '0644'
      with_items: "{{ molecule_platform_instances }}"
      register: platforms

    - name: Discover local Docker images
      community.docker.docker_image_info:
        name: "molecule_pdns/{{ item.item.name | lower | regex_replace('[^a-z0-9_.-]', '_') }}-{{ molecule_docker_arch }}"
      with_items: "{{ platforms.results }}"
      register: docker_images

    - name: Build an Ansible compatible image
      community.docker.docker_image:
        name: "molecule_pdns/{{ platforms.results[item].item.name | lower | regex_replace('[^a-z0-9_.-]', '_') }}-{{ molecule_docker_arch }}"
        source: build
        build:
          dockerfile: "{{ platforms.results[item].item.dockerfile | default(platforms.results[item].dest) }}"
          path: "{{ molecule_ephemeral_directory }}"
          platform: "{{ platforms.results[item].item.platform | default(molecule_docker_platform) }}"
          pull: true
        force_source: "{{ platforms.results[item].item.force | default(false) | bool }}"
        force_tag: "{{ platforms.results[item].item.force | default(false) | bool }}"
      loop: "{{ range(0, platforms.results | length) | list }}"
      loop_control:
        label: "{{ platforms.results[item].item.name }}"
      when: >-
        (platforms.results[item].get('changed', false) | bool) or
        ((docker_images.results[item].images | default([])) | length == 0) or
        (((docker_images.results[item].images | default([]) | first | default({})).Architecture | default('')) != molecule_docker_arch) or
        (platforms.results[item].item.force | default(false) | bool)

    - name: Create molecule instance(s)
      community.docker.docker_container:
        name: "{{ item.name }}"
        hostname: "{{ item.name }}"
        image: "{{ item.image }}"
        platform: "{{ item.platform | default(molecule_docker_platform) }}"
        state: started
        recreate: false
        env: "{{ item.env | default(omit) }}"
        privileged: "no"
        volumes: "{{ item.volumes | default(omit) }}"
      with_items: "{{ molecule_service_instances }}"

    - name: Create the required Services instance(s)
      community.docker.docker_container:
        name: "{{ item.name }}"
        hostname: "{{ item.name }}"
        image: "molecule_pdns/{{ item.name | lower | regex_replace('[^a-z0-9_.-]', '_') }}-{{ molecule_docker_arch }}"
        platform: "{{ item.platform | default(molecule_docker_platform) }}"
        links: "{{ molecule_service_instances | map(attribute='name') | list }}"
        command: "{{ item.command | default(omit) }}"
        state: started
        recreate: false
        privileged: "yes"
        volumes:
          # Mount the cgroups fs to allow SystemD to run into the containers
          - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
        cgroupns_mode: host
      with_items: "{{ molecule_platform_instances }}"

    # Diagnostic: the connection user needs working sudo, and a failure there
    # aborts every play with "PAM account management error" before any task can
    # report why. This runs through the Docker API as root, so it still works
    # when sudo inside the container does not. Remove once the cause is fixed.
    - name: Probe the sudo state of every platform instance
      community.docker.docker_container_exec:
        container: "{{ item.name }}"
        command: >-
          sh -c '
          echo "== id"; id ansible 2>&1;
          echo "== passwd"; getent passwd ansible 2>&1;
          echo "== shadow field count and password field"; getent shadow ansible 2>&1 | awk -F: "{print NF, \"pw=[\" \$2 \"]\"}";
          echo "== sudo binary"; ls -l /usr/bin/sudo 2>&1;
          echo "== sudoers drop-in"; ls -l /etc/sudoers.d/ 2>&1; cat /etc/sudoers.d/ansible 2>&1;
          echo "== sudoers includedir"; grep -hE "^[@#]includedir" /etc/sudoers 2>&1;
          echo "== packages"; (rpm -q sudo pam shadow-utils 2>&1 || dpkg-query -W sudo libpam-modules 2>&1);
          echo "== pam.d/sudo"; cat /etc/pam.d/sudo 2>&1;
          echo "== system-auth link"; ls -l /etc/pam.d/system-auth /etc/pam.d/password-auth 2>&1;
          echo "== system-auth resolves"; readlink -f /etc/pam.d/system-auth 2>&1; test -e /etc/pam.d/system-auth && echo resolves-ok || echo DANGLING;
          echo "== system-auth account lines"; grep -h "^account" /etc/pam.d/system-auth 2>&1;
          echo "== pam modules"; for m in pam_unix pam_faillock pam_localuser pam_succeed_if pam_permit; do
            f=$(ls /usr/lib64/security/$m.so /lib/x86_64-linux-gnu/security/$m.so /usr/lib/x86_64-linux-gnu/security/$m.so /usr/lib/aarch64-linux-gnu/security/$m.so 2>/dev/null | head -1);
            echo "  $m=${f:-MISSING}"; done;
          echo "== pam packages"; (rpm -q pam authselect authselect-libs libpwquality 2>&1 || true);
          echo "== faillock dir"; ls -ld /var/run/faillock /run/faillock 2>&1;
          echo "== tmpfiles unit"; systemctl is-active systemd-tmpfiles-setup.service 2>&1; systemctl is-system-running 2>&1;
          echo "== tmpfiles pam.conf"; grep -h faillock /usr/lib/tmpfiles.d/*.conf 2>&1;
          echo "== shadow line"; getent shadow ansible 2>&1;
          echo "== chage"; chage -l ansible 2>&1;
          echo "== login.defs aging"; grep -hE "^(PASS_MAX_DAYS|PASS_MIN_DAYS|PASS_WARN_AGE|INACTIVE)" /etc/login.defs 2>&1;
          echo "== shadow and helper perms"; ls -l /etc/shadow /usr/sbin/unix_chkpwd /sbin/unix_chkpwd 2>&1;
          echo "== pam.d/sudo account stack"; grep -h "^account" /etc/pam.d/sudo 2>&1;
          echo "== shadow root"; getent shadow root 2>&1;
          echo "== root to a service account, what become_user performs";
          useradd -r molprobe 2>/dev/null;
          getent passwd molprobe 2>&1; getent shadow molprobe 2>&1;
          sudo -n -u molprobe true 2>&1; echo "rc=$?";
          userdel molprobe 2>/dev/null;
          echo "== sudo -l as ansible"; runuser -u ansible -- sudo -n -l 2>&1;
          echo "== sudo true as ansible"; runuser -u ansible -- sudo -n true 2>&1; echo "rc=$?";
          echo "== pam log"; (journalctl -n 20 --no-pager 2>&1 | tail -10; tail -10 /var/log/secure 2>&1);
          '
      register: _molecule_sudo_probe
      changed_when: false
      failed_when: false
      with_items: "{{ molecule_platform_instances }}"

    - name: Report the sudo state
      ansible.builtin.debug:
        msg: "{{ [item.item.name] + (item.stdout_lines | default([])) + (item.stderr_lines | default([])) }}"
      loop: "{{ _molecule_sudo_probe.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"
