---

# Configure one Authoritative Server instance. `instance` is an entry of
# `pdns_multi_instances`; `instance_revision` changes the generated
# configuration so the restart handler is notified, and
# `instance_service_overrides` replaces the systemd drop-in of the instance, so
# a side effect can notify the drop-in handler topic instead.
- name: Configure the PowerDNS instance {{ instance.name }}
  ansible.builtin.include_role:
    name: powerdns.pdns
  vars:
    pdns_service_name: "pdns@{{ instance.name }}"
    pdns_config_file: "pdns-{{ instance.name }}.conf"
    pdns_flush_handlers: true
    pdns_service_overrides: "{{ instance_service_overrides | default(instance_default_service_overrides) }}"
    pdns_backends:
      gsqlite3:
        database: "/var/lib/powerdns/pdns-{{ instance.name }}.sqlite3"
    pdns_sqlite_databases_locations:
      - "/var/lib/powerdns/pdns-{{ instance.name }}.sqlite3"
    pdns_config:
      local-address: 127.0.0.1
      local-port: "{{ instance.port }}"
      webserver: true
      webserver-address: 127.0.0.1
      webserver-port: "{{ instance.webserver_port }}"
      version-string: "revision {{ instance_revision | default(1) }}"
