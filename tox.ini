[tox]
minversion = 1.8
envlist = ansible216,ansible218,ansible220
skipsdist = true

[testenv]
# ansible-core 2.16 supports controller Python 3.10 to 3.12, 2.18 needs 3.11 or
# newer and 2.20 needs 3.12 or newer, so 3.12 is the only interpreter that serves
# all three legs.
basepython = python3.12
passenv = *
deps =
    -rtest-requirements.txt
    ansible216: ansible-core>=2.16.14,<2.17
    ansible218: ansible-core>=2.18,<2.19
    ansible220: ansible-core>=2.20,<2.21
setenv =
  PY_COLORS = 1
commands =
    {posargs:molecule -c molecule/config.yml test --all --destroy always}
